<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transmitter – alpha-channel BFSK</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #panel { position: fixed; top: 12px; left: 12px; background: rgba(255,255,255,.94); padding: 12px 14px;
           border-radius: 8px; width: 300px; font-size: 14px; line-height: 1.5; }
  #panel label { display: block; margin-top: 6px; }
  #panel select, #panel input[type=text] { width: 100%; box-sizing: border-box; font-size: 14px; }
  #panel button { margin-top: 8px; margin-right: 4px; font-size: 14px; padding: 4px 10px; }
  #status { margin-top: 8px; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre; }
  .hint { color: #555; font-size: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <b>Transmitter (screen)</b>
  <label>Bit rate / tones <select id="preset"></select></label>
  <label>Δα (peak-to-peak alpha change)
    <select id="dA"><option value="0.1">0.1</option><option value="0.5" selected>0.5</option>
      <option value="0.2">0.2</option><option value="0.3">0.3</option></select></label>
  <label>Mode <select id="mode"><option value="text">Text (send a word)</option>
      <option value="ber">BER test (64 known bits)</option></select></label>
  <label>Word to send <input type="text" id="msg" value="HELLO" maxlength="32"></label>
  <label>Background picture <input type="file" id="file" accept="image/*"></label>
  <button id="start">Start</button><button id="stop">Stop</button><button id="fs">Fullscreen</button>
  <div class="hint">Press <b>H</b> to hide/show this panel. Settings must match the receiver.</div>
  <div id="status"></div>
</div>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
const canvas = $("c"), ctx = canvas.getContext("2d");
for (const [k, p] of Object.entries(BFSK.PRESETS)) $("preset").add(new Option(p.label, k));
$("preset").value = "4";

// Default static picture, drawn procedurally so no download is needed.
function defaultPicture() {
  const c = document.createElement("canvas"); c.width = 1600; c.height = 900;
  const g = c.getContext("2d");
  const sky = g.createLinearGradient(0, 0, 0, 900);
  sky.addColorStop(0, "#3a7bd5"); sky.addColorStop(0.6, "#f5c16c"); sky.addColorStop(1, "#e07a5f");
  g.fillStyle = sky; g.fillRect(0, 0, 1600, 900);
  g.fillStyle = "#fff4c2"; g.beginPath(); g.arc(1150, 380, 110, 0, 2 * Math.PI); g.fill();
  const hills = [["#3d5a40", 560, 0.004], ["#2b4030", 650, 0.006], ["#1d2b22", 740, 0.009]];
  for (const [col, base, k] of hills) {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, 900);
    for (let x = 0; x <= 1600; x += 10) g.lineTo(x, base - 80 * Math.sin(k * x * 3.1) - 40 * Math.sin(k * x * 7.3));
    g.lineTo(1600, 900); g.fill();
  }
  return c;
}
let picture = defaultPicture();
$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(); img.onload = () => { picture = img; }; img.src = URL.createObjectURL(f);
};

function resize() { canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; }
addEventListener("resize", resize); resize();

let running = false, t0 = 0, bits = [], preset, dA, lastFrame = 0, frameDts = [];
function start() {
  preset = BFSK.PRESETS[$("preset").value];
  dA = parseFloat($("dA").value);
  bits = $("mode").value === "ber" ? BFSK.berPacket() : BFSK.textPacket($("msg").value.toUpperCase());
  t0 = performance.now(); running = true;
}
$("start").onclick = start;
$("stop").onclick = () => { running = false; };
$("fs").onclick = () => document.documentElement.requestFullscreen?.();
addEventListener("keydown", e => { if (e.key === "h" || e.key === "H") $("panel").hidden = !$("panel").hidden; });

function draw(now) {
  if (lastFrame) { frameDts.push(now - lastFrame); if (frameDts.length > 60) frameDts.shift(); }
  lastFrame = now;
  let alpha = 1, info = "idle (alpha = 1)";
  if (running) {
    const r = BFSK.alphaAt((now - t0) / 1000, bits, preset, dA);
    alpha = r.alpha;
    const packetSec = ((bits.length + BFSK.GAP_BITS) * preset.T).toFixed(1);
    info = `bit ${r.idx}/${bits.length} ${r.bit === null ? "(gap)" : "= " + r.bit}\n` +
           `alpha = ${alpha.toFixed(3)}\npacket = ${bits.length} bits, repeats every ${packetSec} s`;
  }
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.globalAlpha = alpha;
  // cover-fit the picture
  const s = Math.max(canvas.width / picture.width, canvas.height / picture.height);
  const w = picture.width * s, h = picture.height * s;
  ctx.drawImage(picture, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
  ctx.globalAlpha = 1;
  const hz = frameDts.length ? 1000 / (frameDts.reduce((a, b) => a + b) / frameDts.length) : 0;
  $("status").textContent = `${info}\nscreen refresh ≈ ${hz.toFixed(0)} Hz`;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
